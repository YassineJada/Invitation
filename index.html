        <a class="btn" id="b-map" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>Itinéraire <span class="ar">| الاتجاهات</span></a>
      </div>
    </section>
  </div>

  <footer><div class="div" aria-hidden="true"><i></i><svg viewBox="-12 -12 24 24"><use href="#fl"/></svg><i></i></div><p class="ar" id="f-ar"></p><p id="f-fr"></p></footer>
</main>

<button id="music" aria-label="Lecture / pause de la musique">♪</button>

<script>
/* ============ CUSTOMIZE HERE ============ */
const CONFIG = {
  groom: "Yassine", bride: "Nouhaila",
  groomAr: "ياسين", brideAr: "نهيلة",
  dateISO: "2026-11-07T20:00:00+01:00",     // wedding date & time (Morocco, UTC+1)
  dateAr: "السبت، 07 نونبر 2026 على الساعة 20h00",
  dateText: "Samedi 07 novembre 2026", timeText: "20h00",
  endHours: 6,                               // calendar event length
  venue: "Salle des Fêtes Elasmar Fouad",
  venueAr: "قاعة الأفراح الأسمر فؤاد",
  address: "Salle des fêtes Elasmar Fouad, Zone Industrielle Aïn Sebaâ, Bernoussi, Casablanca",  // used for Maps & calendar
  addressShort: "Zone Industrielle Aïn Sebaâ, Sidi Bernoussi",  // small text shown on the page
  addressShortAr: "المنطقة الصناعية عين السبع، سيدي البرنوصي",
  introAr: "اضغطوا بمحبة لتكتشفوا دعوتنا",
  introFr: "Nous avons quelque chose de précieux à vous dévoiler",
  hint: "Touchez la fleur",
  msgAr: "بكل حب وامتنان، ندعوكم لمشاركتنا أجمل لحظات حياتنا يوم زفافنا. حضوركم يزيدنا سعادة وبهجة.",
  msgFr: "C'est avec beaucoup de joie que nous vous invitons à célébrer avec nous le plus beau jour de notre vie. Votre présence illuminera cette journée.",
  footerAr: "بكل حب", footerFr: "Avec tout notre amour",
  musicUrl: ""                               // optional audio file URL; shows play/pause button, never autoplays
};
/* ========================================= */
const $ = id => document.getElementById(id), C = CONFIG;

// Flower petals (two layers)
let ph = "";
const shape = "M0 0C-24-18-22-62 0-92C22-62 24-18 0 0Z";
for (let i = 0; i < 8; i++) ph += `<path class="p p1" style="--a:${i*45}deg" d="${shape}" fill="#EBC9C4" stroke="#D8AFA8" stroke-width=".8"/>`;
for (let i = 0; i < 8; i++) ph += `<path class="p p2 pp" style="--a:${i*45+22.5}deg" d="${shape}" fill="#F6E4DC" stroke="#E2C3B8" stroke-width=".8" transform="scale(.8)"/>`;
$("petals").innerHTML = ph;

// Fill content
$("i-ar").textContent = C.introAr; $("i-fr").textContent = C.introFr; $("i-hint").textContent = C.hint;
$("names").innerHTML = `${C.groom}<i>&amp;</i>${C.bride}`;
$("h-ar-intro").innerHTML = `${C.groomAr} <span aria-hidden="true">🤍</span> ${C.brideAr}`;
$("m-ar").textContent = C.msgAr; $("m-fr").textContent = C.msgFr;
$("d-big").innerHTML = `<div>${C.dateText}</div><div class="ar dar" lang="ar" dir="rtl">${C.dateAr}</div>`;
$("venue").innerHTML = `${C.venue}<div class="ar va" lang="ar" dir="rtl">${C.venueAr}</div><span style="font-size:.9rem;margin-top:.4rem">${C.addressShort}</span><span class="ar" lang="ar" dir="rtl" style="font-size:1.1rem;line-height:1.7">${C.addressShortAr}</span>`;
$("f-ar").innerHTML = `${C.footerAr} 🤍`; $("f-fr").textContent = C.footerFr;
document.title = `${C.groom} & ${C.bride} — Invitation`;

// Real links
const start = new Date(C.dateISO), end = new Date(start.getTime() + C.endHours * 36e5);
const fmt = d => d.toISOString().replace(/[-:]|\.\d{3}/g, "");
$("b-cal").href = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
  `&text=${encodeURIComponent("Mariage de " + C.groom + " & " + C.bride)}` +
  `&dates=${fmt(start)}/${fmt(end)}` +
  `&details=${encodeURIComponent("Nous serions honorés de votre présence 🤍")}` +
  `&location=${encodeURIComponent(C.address)}`;
$("b-map").href = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(C.address);

// Countdown
function tick() {
  let s = Math.max(0, Math.floor((start - Date.now()) / 1000));
  const v = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
  const l = ["jours", "heures", "min", "sec"];
  $("count").innerHTML = v.map((n, i) => `<div><b>${String(n).padStart(2, "0")}</b><span>${l[i]}</span></div>`).join("");
}
tick(); setInterval(tick, 1000);

// Reveal
let opened = false;
$("flower").addEventListener("click", () => {
  if (opened) return; opened = true;
  $("flower").classList.add("o1");
  setTimeout(() => {
    $("intro").classList.add("gone");
    document.body.classList.remove("locked");
    $("main").classList.add("show");
    window.scrollTo(0, 0);
    $("flower").tabIndex = -1;
  }, 2200);
  if (audio) audio.play().then(() => $("music").textContent = "❚❚").catch(() => {});
});

// Optional music (only after user interaction)
let audio = null;
if (C.musicUrl) {
  audio = new Audio(C.musicUrl); audio.loop = true; audio.volume = .5;
  $("music").style.display = "block";
  $("music").onclick = () => audio.paused
    ? audio.play().then(() => $("music").textContent = "❚❚")
    : (audio.pause(), $("music").textContent = "♪");
}

// Decorations: scroll reveal + falling petals
const rv=document.querySelectorAll('.frame,.bism,.names,#hero .orn,.msg,.big,.venue,.count,.btns,.date .div,footer p');
rv.forEach(e=>e.classList.add('rv'));
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12}):null;
rv.forEach(e=>io?io.observe(e):e.classList.add('in'));
const fall=document.createElement('div');fall.id='fall';fall.setAttribute('aria-hidden','true');
for(let i=0;i<9;i++){const q=document.createElement('span'),z=9+Math.random()*7;q.className='petal';
q.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${15+Math.random()*10}s;animation-delay:-${Math.random()*22}s;--dx:${(Math.random()*160-80)|0}px`;fall.appendChild(q)}
document.body.appendChild(fall);
</script>
</body>
</html>
